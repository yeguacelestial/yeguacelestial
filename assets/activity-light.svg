<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">GitHub contributions per year</title>
<desc id="desc">2019: 27, 2020: 1,258, 2021: 891, 2022: 554, 2023: 122, 2024: 1,005, 2025: 683, 2026: 3,141. 2026 counted to November 24: 2,903 commits and 229 pull requests.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .tick { font-size: 13px; fill: #5b606b; font-variant-numeric: tabular-nums; }
  .val { font-size: 14px; font-weight: 600; fill: #15171c; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
</style>
<rect width="1200" height="400" rx="18" fill="#f3f3f0"/>
