<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Carlos Nava, full-stack and forward deployed engineer in Mexico</title>
<desc id="desc">Full-stack engineer, forward deployed engineer, AI agents and MCP servers, native iOS in Swift. Open to remote roles and freelance projects. 3,141 GitHub contributions in 2026.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 16px; }
  .role { font-size: 32px; font-weight: 600; letter-spacing: -.5px; fill: #8aa8ff; opacity: 0; animation: role 12s infinite; }
  .r0 { animation-delay: 0s; } .r1 { animation-delay: 3s; } .r2 { animation-delay: 6s; } .r3 { animation-delay: 9s; }
  @keyframes role {
    0% { opacity: 0; transform: translateY(10px); }
    3.00% { opacity: 1; transform: translateY(0); }
    22.00% { opacity: 1; transform: translateY(0); }
    25.00% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .role { animation: none; }
    .r0 { opacity: 1; }
  }
</style>
