<text class="role r0" x="56" y="186">Full-stack engineer.</text><text class="role r1" x="56" y="186">Forward deployed engineer.</text><text class="role r2" x="56" y="186">AI agents &amp; MCP servers.</text><text class="role r3" x="56" y="186">Native iOS in Swift.</text>
<text x="56" y="232" font-size="19" fill="#a3a9b5">I talk to whoever has the problem,</text>
<text x="56" y="258" font-size="19" fill="#a3a9b5">then build and run the fix.</text>
