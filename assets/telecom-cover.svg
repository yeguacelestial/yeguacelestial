<line x1="580" y1="314" x2="620" y2="314" stroke="#2b2f38" stroke-width="2"/><line class="pk" style="animation-delay:0.6s" x1="580" y1="314" x2="620" y2="314" stroke="#8aa8ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 22"/>
