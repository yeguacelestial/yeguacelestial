<rect x="196" y="290" width="160" height="50" rx="10" fill="#1a1d24" stroke="#8aa8ff"/><text x="276.0" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#eef0f3">Ops platform</text><text x="276.0" y="330" text-anchor="middle" font-size="12" fill="#a3a9b5">Django · React</text>
<rect x="420" y="290" width="160" height="50" rx="10" fill="#1a1d24" stroke="#2b2f38"/><text x="500.0" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#eef0f3">SOAP client</text><text x="500.0" y="330" text-anchor="middle" font-size="12" fill="#a3a9b5">AWS Site-to-Site VPN</text>
