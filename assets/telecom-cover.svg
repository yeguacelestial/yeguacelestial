<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
<title id="title">Telecom operations platform</title>
<desc id="desc">96% of SIM activations and prepaid recharges succeed. The owner uses a React and Django platform that talks to carriers over SOAP and an AWS Site-to-Site VPN, with an AI ops agent on the Claude API and MCP.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .pk { animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @media (prefers-reduced-motion: reduce) { .pk { animation: none; } }
</style>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#232733"/></pattern></defs>
<rect width="768" height="512" fill="#111318"/>
<rect width="768" height="512" fill="url(#g)"/>
<text x="44" y="64" font-size="14" font-weight="600" letter-spacing="2.4" fill="#a3a9b5">TELECOM OPERATIONS PLATFORM</text>
<text x="40" y="168" font-size="112" font-weight="600" letter-spacing="-5" fill="#8aa8ff">96%</text>
<text x="44" y="204" font-size="20" fill="#eef0f3">of SIM activations and recharges succeed</text>
<text x="44" y="232" font-size="16" fill="#a3a9b5">Built solo · ~MXN $1M a month · 60% less operating time</text>
