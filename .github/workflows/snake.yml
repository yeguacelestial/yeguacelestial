name: Contribution snake

# Draws the contribution graph as a snake in carlosnava.dev's blue and
# publishes it to the `output` branch, which the README reads from.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#15171c&color_dots=#ebedf0,#c6d4f7,#94aef0,#5b80e3,#1e50d4
            dist/snake-dark.svg?color_snake=#eef0f3&color_dots=#161b22,#1f2a4a,#33478a,#5a76d1,#8aa8ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
